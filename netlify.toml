[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # PORT and DEFAULT_BRANDING are non-sensitive (a local port and the player brand name)
  SECRETS_SCAN_OMIT_KEYS = "PORT,DEFAULT_BRANDING"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
